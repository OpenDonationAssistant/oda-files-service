micronaut:
  application:
    name: oda-files-service
  server:
     max-request-size: '100MB'
     multipart:
         max-file-size: '100MB'
  security:
    token:
      bearer:
        enabled: true
      cookie:
        enabled: true
      jwt:
        signatures:
          jwks:
            keycloak:
              url: ${JWKS_URI}
  caches:
    jwks:
      expire-after-write: 240h
flyway:
  datasources:
    default:
      enabled: true
      schemas: 'files'
      default-schema: 'files'
endpoints:
  health:
    sensitive: false
    details-visible: never
    groups:
      liveness:
        include: ping
      readiness:
        include: '*'
  prometheus:
    sensitive: false
  metrics:
    sensitive: false
