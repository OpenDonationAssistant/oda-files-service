name: Release

on:
  push:
    branches: ["master"]
    paths-ignore:
      - 'README.md'

permissions:
  # contents: write is required by the reusable release workflow in
  # oda-libraries (build.yml), which runs `git tag` + `git push origin <tag>`.
  # Permissions are inherited (and can only be downgraded) by called workflows,
  # so `read` here makes that push fail with 403 for github-actions[bot].
  contents: write
  packages: write

jobs:
  build-and-deploy:
    uses: "OpenDonationAssistant/oda-libraries/.github/workflows/release_service.yml@master"
    secrets: inherit
    with:
      service: files-service
      version: "${{ github.RUN_NUMBER }}"
      packaging: jar
      npm: true
