name: Release

on:
  push:
    branches: ["master"]
    paths-ignore:
      - 'README.md'

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    uses: "OpenDonationAssistant/oda-libraries/.github/workflows/release_service.yml@master"
    secrets: inherit
    with:
      service: files-service
      version: "${{ github.RUN_NUMBER }}"
      packaging: jar
      npm: true
